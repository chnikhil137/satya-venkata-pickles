<!doctype html><html><head><meta charset="utf-8"><title>Responsive QA</title><style>body{background:#ddd;margin:0;padding:14px;font:14px Arial}nav{display:flex;gap:10px;align-items:center;margin-bottom:12px}button{padding:10px}iframe{display:block;border:1px solid #aaa;background:white;height:800px;margin:auto}pre{font:12px monospace;white-space:pre-wrap}</style></head><body><nav><b>Responsive QA</b><button onclick="resize(320)">320px</button><button onclick="resize(360)">360px</button><button onclick="resize(390)">390px</button><button onclick="resize(430)">430px</button><button onclick="resize(768)">768px</button><button onclick="resize(1024)">1024px</button><button onclick="capture()">Capture WhatsApp</button><button onclick="inspect()">Inspect layout</button><button onclick="zoom()">200% text</button><button onclick="unzoom()">100% text</button></nav><iframe id="preview" title="Storefront preview" src="/" width="360"></iframe><pre id="results"></pre><script>function capture(){document.getElementById("preview").contentWindow.open=(url)=>{document.getElementById("results").textContent=url;return null};document.getElementById("results").textContent="Capturing next WhatsApp checkout locally";}function resize(w){document.getElementById('preview').width=w;document.getElementById('results').textContent='Viewport: '+w+'px'}function zoom(){document.getElementById('preview').contentDocument.documentElement.style.fontSize='32px'}function unzoom(){document.getElementById('preview').contentDocument.documentElement.style.fontSize=''}function inspect(){const f=document.getElementById('preview'),d=f.contentDocument,w=f.contentWindow;const overflow=[...d.querySelectorAll('main *,footer *,header *,[role=dialog] *')].filter(e=>{const r=e.getBoundingClientRect(),s=w.getComputedStyle(e);return r.width&&s.position!=='absolute'&&(r.right>w.innerWidth+.5||r.left<-.5)}).map(e=>e.tagName+'.'+e.className);document.getElementById('results').textContent=JSON.stringify({width:w.innerWidth,documentWidth:d.documentElement.scrollWidth,overflow,dialog:d.querySelector('[role=dialog]')?.getBoundingClientRect().toJSON()},null,2)}</script></body></html>
